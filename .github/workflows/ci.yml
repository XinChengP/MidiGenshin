name: tests

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: windows-latest
    env:
      # GitHub 的 Windows 服务器默认编码是 cp1252，无法输出测试里的中文，
      # 强制 Python 使用 UTF-8，避免 UnicodeEncodeError 导致测试中断
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run core pipeline tests
        run: python tests/test_pipeline.py
      - name: Run GUI play-flow tests (dry-run)
        run: python tests/test_gui_play.py
      - name: Run library tests
        run: python tests/test_library.py
      - name: Run start-from tests
        run: python tests/test_start_from.py
      - name: Run launcher script tests
        run: python tests/test_launcher_bat.py
